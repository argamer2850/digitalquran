<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পবিত্র আল-কুরআন</title>

    <link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#00695c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="কুরআন">

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00695c;
            --secondary: #004d40;
            --accent: #ffc107;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #455a64;
            --shadow: 0 12px 40px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg);
            margin: 0;
            color: var(--text-main);
            line-height: 1.8;
        }

        header {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            padding: 70px 20px;
            text-align: center;
            clip-path: ellipse(150% 100% at 50% 0%);
            margin-bottom: 40px;
        }

        header h1 { font-size: 3rem; margin: 0; font-weight: 700; }
        header p { font-size: 1.3rem; opacity: 0.9; margin-top: 10px; }

        .container { max-width: 1000px; margin: 0 auto 50px; padding: 0 20px; }

        /* সিলেকশন বক্স */
        .selector-box {
            position: sticky;
            top: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 50px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.4s ease; /* মসৃণ পরিবর্তনের জন্য */
        }

        /* স্ক্রোল করলে যে স্টাইলটি হবে */
        .selector-box.scrolled {
            background: rgba(13, 27, 30, 0.95); /* ডার্ক ব্যাকগ্রাউন্ড */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        select {
            padding: 15px 25px;
            font-size: 19px;
            font-weight: 600;
            border-radius: 15px;
            border: 2px solid var(--primary);
            width: 100%;
            max-width: 500px;
            background: white;
            color: var(--secondary);
            outline: none;
            transition: all 0.3s ease;
        }

        /* স্ক্রোল অবস্থায় ড্রপডাউন মেনুর স্টাইল */
        .selector-box.scrolled select {
            background: #1a1a1a;
            color: #ffffff;
            border-color: var(--accent);
        }

        /* সূরা হেডার কার্ড */
        .surah-header {
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 30px;
            margin-bottom: 40px;
            text-align: center;
            box-shadow: var(--shadow);
            border-bottom: 8px solid var(--primary);
        }

        .surah-header h2 { 
            font-family: 'Amiri', serif; 
            font-size: 55px; 
            color: var(--primary);
            margin: 0;
        }

        /* নতুন অডিও প্লেয়ার বাটন ডিজাইন */
        .audio-wrapper {
            margin: 30px auto;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .audio-label {
            font-size: 16px;
            font-weight: 700;
            color: var(--secondary);
        }

        .play-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,105,92,0.2);
        }

        .play-btn:hover {
            transform: scale(1.05);
            background: var(--secondary);
        }

        .play-btn.playing {
            background: var(--accent);
            color: var(--secondary);
        }

        /* আয়াত কার্ড */
        .ayah-card {
            background: var(--card-bg);
            margin-bottom: 35px;
            padding: 50px 40px;
            border-radius: 28px;
            box-shadow: var(--shadow);
            transition: 0.3s;
        }

        .arabic {
            font-family: 'Amiri', serif;
            font-size: 42px;
            font-weight: 500;
            color: #000;
            text-align: right;
            line-height: 2.3;
            margin-bottom: 35px;
            direction: rtl;
        }

        .bangla {
            font-size: 23px;
            font-weight: 500;
            color: var(--text-main);
            padding-top: 30px;
            border-top: 2px dotted #eee;
            display: flex;
            align-items: flex-start;
        }

        .ayah-number {
            background: var(--primary);
            color: white;
            min-width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            margin-right: 25px;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0,105,92,0.2);
        }

        .ayah-audio-section {
            margin-top: 30px;
            background: #fcfcfc;
            padding: 10px 20px;
            border-radius: 15px;
            border-left: 4px solid var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }

        .bismillah {
            font-family: 'Amiri', serif;
            font-size: 45px;
            color: var(--secondary);
            margin: 40px 0;
            display: block;
        }

        /* মোবাইল ভিউ */
        @media (max-width: 768px) {
            header h1 { font-size: 2.2rem; }
            .arabic { font-size: 32px; }
            .bangla { font-size: 20px; }
            .ayah-card { padding: 30px 20px; }
            .surah-header h2 { font-size: 42px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>পবিত্র আল-কুরআন</h1>
        <p>সহজ বাংলা অনুবাদ ও অডিও তেলাওয়াত</p>
    </header>

    <div class="container">
        <div class="selector-box">
            <select id="surah-select" onchange="fetchSurah(this.value)">
                <option value="">সূরা লোড হচ্ছে...</option>
            </select>
        </div>

        <div id="quran-display">
            <div style="text-align: center; padding: 100px; font-size: 24px; color: var(--primary);">অপেক্ষা করুন...</div>
        </div>
    </div>

    <script>
        const surahSelect = document.getElementById('surah-select');
        const display = document.getElementById('quran-display');

        // স্ক্রোল ইফেক্ট হ্যান্ডেলার
        window.onscroll = function() {
            const selectorBox = document.querySelector('.selector-box');
            if (window.scrollY > 50) {
                selectorBox.classList.add('scrolled');
            } else {
                selectorBox.classList.remove('scrolled');
            }
        };

        // অডিও প্লে/পজ হ্যান্ডেলার
        function toggleAudio(btn, audioId) {
            const audio = document.getElementById(audioId);
            
            // অন্য সব অডিও বন্ধ করা
            document.querySelectorAll('audio').forEach(el => {
                if(el !== audio) {
                    el.pause();
                    const otherBtn = el.parentElement.querySelector('.play-btn');
                    if(otherBtn) {
                        otherBtn.classList.remove('playing');
                        otherBtn.innerHTML = '▶';
                    }
                }
            });

            if (audio.paused) {
                audio.volume = 0.5; // ৫০% ভলিউম
                audio.play();
                btn.classList.add('playing');
                btn.innerHTML = '⏸';
            } else {
                audio.pause();
                btn.classList.remove('playing');
                btn.innerHTML = '▶';
            }
            
            audio.onended = () => {
                btn.classList.remove('playing');
                btn.innerHTML = '▶';
            };
        }

        async function loadSurahList() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                surahSelect.innerHTML = '';
                data.data.forEach(surah => {
                    const option = document.createElement('option');
                    option.value = surah.number;
                    option.textContent = `${surah.number}. ${surah.englishName} (${surah.name})`;
                    surahSelect.appendChild(option);
                });
                fetchSurah(1);
            } catch (err) {
                display.innerHTML = "ইন্টারনেট কানেকশন নেই।";
            }
        }

        async function fetchSurah(surahNumber) {
            if(!surahNumber) return;
            display.innerHTML = '<div style="text-align:center; padding:100px; font-size:24px;">তথ্য লোড হচ্ছে...</div>';
            
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,bn.bengali,ar.alafasy`);
                const data = await res.json();

                const arabic = data.data[0];
                const bangla = data.data[1];
                const audio = data.data[2];

                const fullSurahAudioUrl = `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${surahNumber}.mp3`;

                let htmlContent = `
                    <div class="surah-header">
                        <h2>${arabic.name}</h2>
                        <div style="font-size: 22px; color: var(--text-muted); margin: 10px 0;">${arabic.englishName} (${arabic.englishNameTranslation})</div>
                        
                        <div class="audio-wrapper">
                            <span class="audio-label">পুরো সূরা একসাথে শুনুন:</span>
                            <audio id="full-surah-audio" style="display:none;">
                                <source src="${fullSurahAudioUrl}" type="audio/mpeg">
                            </audio>
                            <button class="play-btn" onclick="toggleAudio(this, 'full-surah-audio')">▶</button>
                        </div>

                        ${surahNumber != 1 && surahNumber != 9 ? '<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰনِ الرَّহِيمِ</div>' : ''}
                    </div>
                `;

                arabic.ayahs.forEach((ayah, index) => {
                    let text = ayah.text;
                    if (index === 0 && surahNumber != 1 && surahNumber != 9) {
                        text = text.replace("بِسْمِ اللَّهِ الرَّحْمَٰনِ الرَّহِيمِ", "");
                    }

                    htmlContent += `
                        <div class="ayah-card">
                            <div class="arabic">${text}</div>
                            <div class="bangla">
                                <span class="ayah-number">${index + 1}</span> 
                                <span>${bangla.ayahs[index].text}</span>
                            </div>
                            <div class="ayah-audio-section">
                                <span style="font-weight:700; color:var(--text-muted); font-size:15px;">আয়াত শুনুন:</span>
                                <audio id="ayah-audio-${index}" style="display:none;">
                                    <source src="${audio.ayahs[index].audio}" type="audio/mpeg">
                                </audio>
                                <button class="play-btn" style="width:35px; height:35px; font-size:14px;" onclick="toggleAudio(this, 'ayah-audio-${index}')">▶</button>
                            </div>
                        </div>
                    `;
                });

                display.innerHTML = htmlContent;
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (err) {
                display.innerHTML = "তথ্য লোড করা সম্ভব হয়নি।";
            }
        }

        loadSurahList();
    </script>
</body>
</html>
